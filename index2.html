<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورشة المنح الدراسية | Veritasium</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --primary: #7b1e2b;
        --primary-dark: #54131d;
        --gold: #b89552;
        --bg: #f5f1ea;
        --card: #ffffff;
        --text: #29221e;
        --muted: #74685f;
        --border: #ddd2c5;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, "Tahoma", sans-serif;
        background:
            radial-gradient(circle at top right, rgba(184,149,82,0.10), transparent 35%),
            linear-gradient(135deg, #f8f5f0, #eee8df);
        color: var(--text);
    }

    .container {
        width: min(680px, 94%);
        margin: 30px auto;
    }

    /* الشعار */

    .logo-box {
        background: var(--card);
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 18px;
        text-align: center;
        border-top: 5px solid var(--primary);
        box-shadow: 0 8px 25px rgba(70, 45, 30, 0.10);
    }

    .logo {
        width: 190px;
        max-width: 70%;
        height: auto;
        display: block;
        margin: auto;
    }

    /* الهيدر */

    .header {
        position: relative;
        overflow: hidden;
        background: var(--card);
        border-radius: 20px;
        padding: 32px 28px;
        margin-bottom: 18px;
        border-right: 5px solid var(--primary);
        box-shadow: 0 8px 25px rgba(70, 45, 30, 0.10);
    }

    .header::before {
        content: "";
        position: absolute;
        width: 160px;
        height: 160px;
        background: rgba(184,149,82,0.08);
        border-radius: 50%;
        top: -80px;
        left: -50px;
    }

    .header h1 {
        position: relative;
        margin: 0 0 12px;
        font-size: 31px;
        color: var(--primary);
    }

    .header p {
        position: relative;
        margin: 0 0 14px;
        line-height: 1.9;
        color: var(--muted);
        font-size: 16px;
    }

    .required {
        color: #b51f35;
    }

    .note {
        position: relative;
        display: inline-block;
        padding: 7px 12px;
        background: #f7f0e4;
        border-radius: 8px;
        color: #7a6135;
        font-size: 13px;
    }

    /* الأسئلة */

    .question {
        background: var(--card);
        padding: 24px;
        margin-bottom: 14px;
        border-radius: 16px;
        border: 1px solid rgba(120,90,60,0.10);
        border-right: 4px solid var(--gold);
        box-shadow: 0 5px 18px rgba(70,45,30,0.07);
        transition: 0.2s ease;
    }

    .question:focus-within {
        border-right-color: var(--primary);
        box-shadow: 0 7px 22px rgba(123,30,43,0.10);
    }

    label {
        display: block;
        margin-bottom: 11px;
        font-weight: bold;
        color: #3b3029;
        font-size: 16px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        background: #fff;
        color: var(--text);
        font-family: inherit;
        transition: 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(123,30,43,0.08);
    }

    input::placeholder {
        color: #aaa09a;
    }

    /* خيارات الحضور */

    .options {
        margin-top: 5px;
    }

    .options label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 13px 0;
        padding: 12px;
        border-radius: 9px;
        font-weight: normal;
        cursor: pointer;
        transition: 0.2s;
    }

    .options label:hover {
        background: #f8f3ec;
    }

    .options input {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
        cursor: pointer;
    }

    /* زر التسجيل */

    button {
        width: 100%;
        padding: 16px;
        margin-top: 4px;
        background: linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 7px 18px rgba(123,30,43,0.20);
        transition: 0.25s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(123,30,43,0.25);
    }

    button:active {
        transform: translateY(0);
    }

    button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
    }

    /* رسائل الحالة */

    #success {
        display: none;
        background: #f0eadc;
        color: #67501f;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        margin-top: 16px;
        font-size: 17px;
        border: 1px solid #d8c69b;
    }

    #error {
        display: none;
        background: #f8e7e8;
        color: var(--primary);
        padding: 16px;
        border-radius: 12px;
        text-align: center;
        margin-top: 16px;
        border: 1px solid #dfb8bd;
    }

    /* الفوتر */

    .footer {
        text-align: center;
        margin: 25px 0 15px;
        color: #8b7d71;
        font-size: 12px;
        letter-spacing: 0.5px;
    }

    /* الهاتف */

    @media (max-width: 600px) {

        .container {
            width: 94%;
            margin: 14px auto;
        }

        .logo-box {
            padding: 20px;
            border-radius: 16px;
        }

        .logo {
            width: 165px;
        }

        .header {
            padding: 25px 21px;
            border-radius: 16px;
        }

        .header h1 {
            font-size: 26px;
        }

        .header p {
            font-size: 15px;
        }

        .question {
            padding: 19px;
            border-radius: 14px;
        }

        input,
        select,
        textarea {
            padding: 13px;
            font-size: 15px;
        }

        button {
            padding: 15px;
            font-size: 17px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- الشعار -->
    <div class="logo-box">
        <img
            src="veritasium-logo.jpeg"
            alt="شعار Veritasium"
            class="logo">
    </div>


    <!-- مقدمة الورشة -->
    <div class="header">

        <h1>ورشة المنح الدراسية</h1>

        <p>
            أهلاً بك في ورشة المنح الدراسية.
            يرجى تعبئة المعلومات التالية لإتمام التسجيل
            والحصول على تفاصيل الورشة.
        </p>

        <div class="note">
            <span class="required">*</span>
            جميع الحقول المطلوبة يجب تعبئتها
        </div>

    </div>


    <!-- الاستمارة -->
    <form
        id="registrationForm"
        action="https://formsubmit.co/nwrrswljasm@gmail.com"
        method="POST">

        <!-- إعدادات البريد -->

        <input
            type="hidden"
            name="_subject"
            value="تسجيل لورشة المنح">

        <input
            type="hidden"
            name="_template"
            value="table">

        <input
            type="hidden"
            name="_captcha"
            value="false">


        <!-- الاسم -->

        <div class="question">

            <label>
                الاسم الثلاثي بالعربي
                <span class="required">*</span>
            </label>

            <input
                type="text"
                name="full_name"
                placeholder="اكتب اسمك الثلاثي بالعربي"
                maxlength="100"
                autocomplete="name"
                required>

        </div>


        <!-- العمر -->

        <div class="question">

            <label>
                العمر
                <span class="required">*</span>
            </label>

            <input
                type="number"
                name="age"
                placeholder="اكتب عمرك"
                min="1"
                max="120"
                required>

        </div>


        <!-- التليجرام -->

        <div class="question">

            <label>
                معرف التليجرام
                <span class="required">*</span>
            </label>

            <input
                type="text"
                name="telegram"
                placeholder="@username"
                maxlength="100"
                required>

        </div>


        <!-- تأكيد الحضور -->

        <div class="question">

            <label>
                هل أنت متأكد من حضورك؟
                <span class="required">*</span>
            </label>

            <div class="options">

                <label>
                    <input
                        type="radio"
                        name="attendance"
                        value="نعم"
                        required>
                    نعم، سأحضر
                </label>

                <label>
                    <input
                        type="radio"
                        name="attendance"
                        value="لا">
                    لا، لن أتمكن من الحضور
                </label>

                <label>
                    <input
                        type="radio"
                        name="attendance"
                        value="ربما">
                    ربما
                </label>

            </div>

        </div>


        <!-- زر التسجيل -->

        <button
            type="submit"
            id="submitButton">

            تسجيل في الورشة

        </button>

    </form>


    <!-- نجاح -->

    <div id="success">
        ✅ تم تسجيلك في ورشة المنح الدراسية بنجاح!
    </div>


    <!-- خطأ -->

    <div id="error">
        ❌ حدث خطأ أثناء الإرسال. حاول مرة أخرى.
    </div>


    <!-- الفوتر -->

    <div class="footer">
        Veritasium • Research • Discover • Understand
    </div>

</div>


<script>

const form = document.getElementById("registrationForm");
const button = document.getElementById("submitButton");
const success = document.getElementById("success");
const error = document.getElementById("error");

form.addEventListener("submit", function () {

    button.disabled = true;
    button.textContent = "جارٍ إرسال التسجيل...";

    error.style.display = "none";

});

</script>

</body>
</html>
